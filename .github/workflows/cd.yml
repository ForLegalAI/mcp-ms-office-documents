name: Build & Push Docker Image

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    # Publishing a release needs write access, so only maintainers ever start
    # this. The repository check keeps a fork's copy from queueing forever for
    # a runner it does not have.
    if: github.repository == 'ForLegalAI/mcp-ms-office-documents'
    runs-on: zoomies-forlegalai-actions-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test -n "$RELEASE_TAG" || { echo "::error::release.tag_name is empty"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # A prerelease must not become `latest`: everyone pulling the default
          # tag would get the beta. `latest` moves only on a full release; the
          # expression yields an empty line otherwise, which the action ignores.
          tags: |
            georgx22/mcp-office-docs:${{ github.event.release.tag_name }}
            ${{ !github.event.release.prerelease && 'georgx22/mcp-office-docs:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
